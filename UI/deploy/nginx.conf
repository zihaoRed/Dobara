# ============================================================
# Dobara Nginx Configuration
# root /var/www/dobara — portal at site root, apps in subdirs
# ============================================================

server {
    listen 80;
    server_name your-domain.com;

    root /var/www/dobara;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Portal hashed assets
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # App hashed assets (must be before app HTML locations)
    location ^~ /consumer/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
    location ^~ /tablet/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
    location ^~ /management/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
    location ^~ /ops/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # version.json — never cache
    location = /consumer/version.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
    location = /tablet/version.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
    location = /management/version.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
    location = /ops/version.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # /consumer → /consumer/ (avoid ambiguous cache key)
    location = /consumer { return 302 /consumer/; }
    location = /tablet { return 302 /tablet/; }
    location = /management { return 302 /management/; }
    location = /ops { return 302 /ops/; }

    # App shells — HTML / SW / etc must revalidate every time
    # Use root (not alias) so try_files + Cache-Control apply reliably
    location ^~ /consumer/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /consumer/index.html;
    }
    location ^~ /tablet/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /tablet/index.html;
    }
    location ^~ /management/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /management/index.html;
    }
    location ^~ /ops/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /ops/index.html;
    }

    # Portal HTML
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
