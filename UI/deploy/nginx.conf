# ============================================================
# Dobara Nginx Configuration
# Place this file at: /etc/nginx/sites-available/dobara
# Then: ln -s /etc/nginx/sites-available/dobara /etc/nginx/sites-enabled/
# Test:  nginx -t
# Apply: nginx -s reload
# ============================================================

server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名或公网IP

    # 根路径 → Portal 入口页
    root /var/www/dobara/portal;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # 静态资源缓存 (JS/CSS/图片)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ========== Portal (根路径) ==========
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========== Consumer 用户端 ==========
    location /consumer {
        alias /var/www/dobara/consumer;
        try_files $uri $uri/ /consumer/index.html;
    }

    # ========== Store Tablet 门店平板端 ==========
    location /tablet {
        alias /var/www/dobara/tablet;
        try_files $uri $uri/ /tablet/index.html;
    }

    # ========== Management 管理端 ==========
    location /management {
        alias /var/www/dobara/management;
        try_files $uri $uri/ /management/index.html;
    }

    # ========== Ops Admin 运营后台 ==========
    location /ops {
        alias /var/www/dobara/ops;
        try_files $uri $uri/ /ops/index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
