# ============================================================
# Dobara Nginx Configuration
# Align with deploy.sh: root /var/www/dobara (portal at site root)
# Test:  nginx -t
# Apply: nginx -s reload
# ============================================================

server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名或公网IP

    root /var/www/dobara;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Vite 带 hash 的 JS/CSS：长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ~* ^/(consumer|tablet|management|ops)/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # 版本探测文件：禁止缓存
    location ~* ^/(consumer|tablet|management|ops)/version\.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ========== Portal — HTML 禁止缓存 ==========
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # ========== Consumer ==========
    location /consumer {
        alias /var/www/dobara/consumer;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /consumer/index.html;
    }

    # ========== Store Tablet ==========
    location /tablet {
        alias /var/www/dobara/tablet;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /tablet/index.html;
    }

    # ========== Management ==========
    location /management {
        alias /var/www/dobara/management;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /management/index.html;
    }

    # ========== Ops Admin ==========
    location /ops {
        alias /var/www/dobara/ops;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /ops/index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
